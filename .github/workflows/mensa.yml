name: Glutenfrei-Check Mensa

on:
  # HAUPT-START: cron-job.org ruft jeden Werktag um 9:00 Uhr (deutsche Zeit)
  # die GitHub-API auf und startet diesen Workflow ("workflow_dispatch").
  # Das ist pünktlich, im Gegensatz zum GitHub-Zeitplan unten.
  # Auch der Knopf "Run workflow" in GitHub nutzt diesen Weg.
  workflow_dispatch:
    inputs:
      force:
        description: "Auch senden, wenn heute schon gesendet wurde"
        type: boolean
        default: false

  # BACKUP: GitHub-eigener Zeitplan. Der startet oft Stunden zu spät,
  # springt aber ein, falls cron-job.org mal ausfällt. Wurde heute schon
  # gesendet, schickt das Skript nichts doppelt.
  schedule:
    # GitHub rechnet in UTC: 07:05 UTC = 09:05 Uhr (Sommer) bzw. 08:05 Uhr (Winter).
    # Format: Minute Stunde Tag Monat Wochentag  (1-5 = Montag bis Freitag)
    - cron: "5 7 * * 1-5"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Code aus dem Repo holen
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Skript ausführen und Nachricht senden
        env:
          # Der Topic-Name kommt aus dem GitHub Secret "NTFY_TOPIC"
          # (Settings -> Secrets and variables -> Actions).
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          # Nur beim manuellen Start mit Häkchen "force" gesetzt.
          FORCE_SEND: ${{ inputs.force }}
        run: python check_mensa.py
